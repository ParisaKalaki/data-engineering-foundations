[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-engineering-foundations"
version = "0.1.0"
description = "Data engineering foundations project"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
